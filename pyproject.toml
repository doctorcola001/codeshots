[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeshots"
version = "1.0.0"
description = "Render source snippets into syntax-highlighted PNGs"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["Pillow>=10", "Pygments>=2.15"]

[project.scripts]
codeshots = "codeshots:main"

[tool.setuptools]
py-modules = ["codeshots"]
